<div class="layout-wrapper">
  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="navbar-container">
      <div class="brand">
        <span class="brand-icon">📦</span>
        <span class="brand-text">ProductHub</span>
        <span class="tech-stack-badge">.NET + Angular + SQL Server</span>
      </div>
      <nav class="nav-links">
        <a routerLink="/products" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Products</a>
        <a routerLink="/products/new" routerLinkActive="active">+ New Product</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Body -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Application Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <p>© {{ currentYear }} ProductHub · Full-Stack DevOps Starter</p>
      <div class="footer-badges">
        <span>ASP.NET Core Web API</span>
        <span>•</span>
        <span>Angular 18</span>
        <span>•</span>
        <span>SQL Server EF Core</span>
      </div>
    </div>
  </footer>
</div>
