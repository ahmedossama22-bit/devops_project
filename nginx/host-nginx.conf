# Host Nginx Configuration File
# Copy or include this configuration into your Host Nginx (e.g., /etc/nginx/sites-available/default or nginx.conf)

server {
    listen 80;
    server_name localhost;

    # Set root directory to your Angular frontend build output (dist/frontend/browser)
    # Adjust this path according to where your static files are deployed on the host
    root /var/www/frontend;
    index index.html;

    # Serve static assets and handle Angular SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Dockerized Backend running on host port 5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
